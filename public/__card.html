<!doctype html><html><head><meta charset="utf-8">
<link href="css/normalize.css" rel="stylesheet"><link href="css/webflow.css" rel="stylesheet">
<link href="css/cedar-hollow-uk.webflow.css" rel="stylesheet"></head>
<body><div class="section-properties"><ul role="list" class="splide__list" id="ch-featured"></ul></div>
<pre id="out"></pre>
<script src="js/listings.js"></script>
<script>
window.addEventListener('load',function(){
 var CH=window.CedarHollowSearch;
 var items=CH.featured().filter(function(l){return l.destination==="Oxford";});
 document.getElementById("ch-featured").innerHTML=items.map(CH.featuredCardHtml).join("");
 var p=document.querySelector('.cabin-item_features p');
 var c=getComputedStyle(p);
 var name=document.querySelector('.cabin-item .heading-style-h4');
 var cn=getComputedStyle(name);
 document.getElementById('out').textContent=JSON.stringify({
  tag:{text:p.textContent,font:c.fontFamily.split(',')[0],size:c.fontSize,weight:c.fontWeight,
       lineHeight:c.lineHeight,tracking:c.letterSpacing,transform:c.textTransform,color:c.color},
  cardName:{text:name.textContent,font:cn.fontFamily.split(',')[0],size:cn.fontSize,weight:cn.fontWeight}
 },null,1);
});
</script></body></html>
