# Cedar Hollow — Cloudflare Workers configuration.
#
# One Worker serves the static site and the contact-form endpoint. It deploys
# itself: Cloudflare Workers Builds runs `npx wrangler deploy` on every push to
# main (see docs/PAGES_UPLOAD.md). The name below must match the Worker the repo
# is connected to, or those builds fail.
#
# There is deliberately no package.json: the Worker has no imports at all, so
# there is nothing to install.

name = "cedar-hollow-uk"
main = "worker/index.js"
compatibility_date = "2026-09-02"

# --- Static site -------------------------------------------------------------
# The site lives in public/, which holds the site and nothing else. Anything
# outside that directory cannot be published by accident, so public/.assetsignore
# only has to cover the one oversized file.
#
# Requests to these files are served straight from Cloudflare's edge without
# invoking the Worker, and are free and unmetered.

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"   # serves /404.html once one exists

# --- Contact form ------------------------------------------------------------
# Mail goes through Resend's HTTP API. Cloudflare's own send_email binding was
# the original plan, but its free path needs Email Routing to take over the
# domain's MX records, and those belong to Google Workspace.
#
# CONTACT_TO is where the Railway form-handler sends today, kept as-is so the
# migration does not silently redirect enquiries.
#
# CONTACT_FROM must be on the SUBDOMAIN verified in Resend — never the apex.
# Resend recommends a subdomain for deliverability, and it keeps every DNS
# record this needs away from cedarhollow.uk's own SPF and MX.
#
# The API key is a secret, not a var. Set it once with:
#
#   npx wrangler secret put RESEND_API_KEY
#
# Never put the key in this file — it is committed to the repo.

[vars]
CONTACT_TO = "hello@thelabgroup.com"
CONTACT_FROM = "website@send.cedarhollow.uk"
CONTACT_FROM_NAME = "Cedar Hollow website"

# --- Instagram ---------------------------------------------------------------
# GET /api/instagram?site=oxford|dorset returns the four most recent posts for
# that woodland, which js/instagram-live.js paints into the grid on the two
# location home pages.
#
# The two woodlands are two accounts, so two tokens:
#
#   @cedarhollowoxford            -> IG_TOKEN_OXFORD
#   @mallinsonswoodlandretreat    -> IG_TOKEN_DORSET
#
# Both are secrets, set once each:
#
#   npx wrangler secret put IG_TOKEN_OXFORD
#   npx wrangler secret put IG_TOKEN_DORSET
#
# Never put a token in this file — it is committed to the repo, same as the
# Resend key above.
#
# Until a token is set the endpoint answers 503 and each page keeps the four
# curated posts in its own markup, so the grid is never empty.
#
# Instagram's long-lived tokens last 60 days. Every Monday at 04:17 UTC the
# cron below swaps each for a fresh one and keeps it in this KV namespace,
# since a Worker cannot rewrite its own secrets. /health shows the last
# renewal per site; if a token lapses anyway, set a new secret and it takes
# over at once.

[[kv_namespaces]]
binding = "IG_KV"
id = "8d6bb0fe7112447ca233e6cd03e8d8b8"   # cedar-hollow-instagram

[triggers]
crons = ["17 4 * * 1"]

# --- Previews ----------------------------------------------------------------
# Every branch other than main is built with `npx wrangler preview`, which gets
# its own URL and leaves the live site alone. It refuses to run without this
# block, because it will not guess which settings a preview should share with
# production.
#
# The contact addresses are the same as production: a test enquiry from a
# preview lands in the same inbox, which is what you want when checking one.
#
# The KV namespace is NOT shared. Previews get an empty one of their own, so
# nothing a preview does can overwrite the live site's renewed Instagram
# tokens. Cron triggers do not run on previews at all.

[previews.vars]
CONTACT_TO = "hello@thelabgroup.com"
CONTACT_FROM = "website@send.cedarhollow.uk"
CONTACT_FROM_NAME = "Cedar Hollow website"

[[previews.kv_namespaces]]
binding = "IG_KV"
id = "32001cdba6234083a471c18aef5bbc5f"   # cedar-hollow-instagram-preview
