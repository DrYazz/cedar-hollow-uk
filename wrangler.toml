# Cedar Hollow — Cloudflare Workers configuration.
#
# One Worker serves the static site and the contact-form endpoint. It deploys
# itself: Cloudflare Workers Builds runs `npx wrangler deploy` on every push to
# main (see docs/PAGES_UPLOAD.md). The name below must match the Worker the repo
# is connected to, or those builds fail.
#
# There is deliberately no package.json: the Worker has no imports at all, so
# there is nothing to install.

name = "cedar-hollow-uk"
main = "worker/index.js"
compatibility_date = "2026-09-02"

# --- Build stamp -------------------------------------------------------------
# Before every deploy, write public/build.json naming the commit being
# deployed, so the site can say which commit is live. The health check in
# .github/workflows/site-health.yml relies on it to spot a build that never
# deployed, and starts another. Needs only Node, which the build image has.
#
# watch_dir is set so that `wrangler dev` does not rebuild every time it sees
# build.json change, which it would if it watched the whole repo.

[build]
command = "node scripts/stamp-build.mjs"
watch_dir = "scripts"

# --- Static site -------------------------------------------------------------
# The site lives in public/, which holds the site and nothing else. Anything
# outside that directory cannot be published by accident, so public/.assetsignore
# only has to cover the one oversized file.
#
# Requests to these files are served straight from Cloudflare's edge without
# invoking the Worker, and are free and unmetered.

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"   # serves /404.html once one exists
# Serve pages at the address they are written with. Cloudflare's default
# (auto-trailing-slash) answered every /page.html with a temporary redirect to
# /page, but every canonical, the sitemap and every internal link on the site
# use .html -- so Google was told the true address of each page was one that
# bounced, and each click cost a round trip. The short forms people may
# already have shared are sent on permanently by public/_redirects.
html_handling = "none"
# Videos go through the Worker, which answers a request for part of one with
# that part (see serveVideo). The asset server answers every Range request
# with the whole file, and Safari -- every browser on an iPhone -- will not
# play a video from a server that does that until the file happens to be in
# its cache, so the hero sat on its still image until a reload.
# A list here also decides what reaches the Worker at all: with a list, a
# request matching none of it goes to the asset server alone, which answers
# a POST with 405 and any unknown address with the 404 page. So every address
# the Worker answers itself is on it -- the API, /health and the two
# directory spellings in PAGE_ALIASES -- as well as the videos. A new Worker
# route needs adding here too, or it will never be reached.
# /wdtcf is the private visitor map: its files are in public/wdtcf/, and must
# reach the Worker first so that none of them is served without the signed
# token Cloudflare Access adds once someone has signed in (see signedIn).
run_worker_first = [
  "/api/*",
  "/health",
  "/wdtcf",
  "/wdtcf/*",
  "/oxford/",
  "/dorset/",
  "/images/*.mp4",
  "/videos/*",
  "/oxford/videos/*",
]

# --- Contact form ------------------------------------------------------------
# Mail goes through Resend's HTTP API. Cloudflare's own send_email binding was
# the original plan, but its free path needs Email Routing to take over the
# domain's MX records, and those belong to Google Workspace.
#
# CONTACT_TO is where the Railway form-handler sends today, kept as-is so the
# migration does not silently redirect enquiries.
#
# CONTACT_FROM must be on the SUBDOMAIN verified in Resend — never the apex.
# Resend recommends a subdomain for deliverability, and it keeps every DNS
# record this needs away from cedarhollow.uk's own SPF and MX.
#
# The API key is a secret, not a var. Set it once with:
#
#   npx wrangler secret put RESEND_API_KEY
#
# Never put the key in this file — it is committed to the repo.

[vars]
CONTACT_TO = "hello@thelabgroup.com"
CONTACT_FROM = "website@send.cedarhollow.uk"
CONTACT_FROM_NAME = "Cedar Hollow website"

# Visitor reports (see worker/index.js): where they go, and which
# account and Web Analytics site it reads. Neither ID is a secret -- both
# appear in every dashboard address. The API token it reads with is one:
#
#   npx wrangler secret put ANALYTICS_API_TOKEN
#
# It needs Account Analytics: Read on this account, and nothing else.
REPORT_TO = "hello@thelabgroup.com"
ANALYTICS_ACCOUNT = "8a9f8097ba4ff03c5a70f8b811c2902e"
ANALYTICS_SITE = "ae885004b4b34ac2a39e3b5dc349a8eb"   # cedarhollow.uk

# Searches on Google in the same reports: the Search Console property they
# read, and theoaks.uk's while Google moves it over. They read it as the
# service account cedar-hollow-website@cedar-hollow-reports.iam.gserviceaccount.com
# (Google Cloud project "Cedar Hollow Reports"), a Restricted user of each
# property, whose key is a secret:
#
#   npx wrangler secret put GSC_KEY      (the JSON file, as downloaded)
#
# Without it the reports simply leave the section out.
#
# Bookings reach the reports from Checked.in, which POSTs each one to
# /api/booking with a password both sides know, also a secret:
#
#   npx wrangler secret put BOOKING_SECRET
GSC_SITE = "sc-domain:cedarhollow.uk"
GSC_OLD_SITE = "sc-domain:theoaks.uk"

# --- Instagram ---------------------------------------------------------------
# GET /api/instagram?site=oxford|dorset returns the four most recent posts for
# that woodland, which js/instagram-live.js paints into the grid on the two
# location home pages.
#
# The two woodlands are two accounts, so two tokens:
#
#   @cedarhollowoxford            -> IG_TOKEN_OXFORD
#   @mallinsonswoodlandretreat    -> IG_TOKEN_DORSET
#
# Both are secrets, set once each:
#
#   npx wrangler secret put IG_TOKEN_OXFORD
#   npx wrangler secret put IG_TOKEN_DORSET
#
# Never put a token in this file — it is committed to the repo, same as the
# Resend key above.
#
# Until a token is set the endpoint answers 503 and each page keeps the four
# curated posts in its own markup, so the grid is never empty.
#
# Instagram's long-lived tokens last 60 days. Every Monday at 04:17 UTC the
# cron below swaps each for a fresh one and keeps it in this KV namespace,
# since a Worker cannot rewrite its own secrets. /health shows the last
# renewal per site; if a token lapses anyway, set a new secret and it takes
# over at once.
#
# The cron runs every day at 04:17 UTC, not just Mondays: each morning it
# keeps the previous day's visitor figures while they are still exact (see
# "Visitor reports" in worker/index.js). On Mondays it also renews the
# Instagram tokens and emails the visitor report for the Monday to Sunday just
# ended; on the 1st of each month, the report for the month just ended; and on
# 1 January, the report for the year, with its graphs.

[[kv_namespaces]]
binding = "IG_KV"
id = "8d6bb0fe7112447ca233e6cd03e8d8b8"   # cedar-hollow-instagram

# --- Visitor map -------------------------------------------------------------
# Where visits come from, by town, for the private map at /wdtcf (see
# VISIT_PATH in worker/index.js). js/analytics.js tells POST /api/visit when a
# visit begins and when it reaches Oxford's or Dorset's pages; the Worker
# counts it in this D1 database against the town request.cf places it in, a
# count per town per day and nothing else. D1 rather than IG_KV: KV's free
# plan allows 1,000 writes a day, and the site has more visits than that will
# soon carry. migrations/ holds the table, applied with:
#
#   npx wrangler d1 migrations apply cedar-hollow-visits --remote
#
# The map is behind Cloudflare Access: an emailed code, for the addresses on
# the "Visitor Map Owners" policy (Zero Trust > Access controls >
# Applications > cedarhollow.uk). The Worker checks the token Access signs,
# against the team and application in ACCESS_TEAM and ACCESS_AUD in
# worker/index.js, and shows nothing without it. Running locally, where
# Access is not in front, WDTCF_DEV_PASSWORD in .dev.vars stands in.
#
# Without the database the visits are not counted. Previews have none.

# Which version of the Worker is running, so the live report's kept copies
# (see liveReport) are this version's alone.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "VISITS_DB"
database_name = "cedar-hollow-visits"
database_id = "f88b7e6c-99ad-40c8-a9e7-28af257149c5"

[triggers]
crons = ["17 4 * * *"]

# --- Previews ----------------------------------------------------------------
# Every branch other than main is built with `npx wrangler preview`, which gets
# its own URL and leaves the live site alone. It refuses to run without this
# block, because it will not guess which settings a preview should share with
# production.
#
# The contact addresses are the same as production: a test enquiry from a
# preview lands in the same inbox, which is what you want when checking one.
#
# The KV namespace is NOT shared. Previews get an empty one of their own, so
# nothing a preview does can overwrite the live site's renewed Instagram
# tokens. Cron triggers do not run on previews at all.

[previews.vars]
CONTACT_TO = "hello@thelabgroup.com"
CONTACT_FROM = "website@send.cedarhollow.uk"
CONTACT_FROM_NAME = "Cedar Hollow website"

[[previews.kv_namespaces]]
binding = "IG_KV"
id = "32001cdba6234083a471c18aef5bbc5f"   # cedar-hollow-instagram-preview
