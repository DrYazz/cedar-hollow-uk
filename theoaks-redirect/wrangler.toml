# theoaks.uk -> cedarhollow.uk -- see index.js.
#
# A separate Worker from the site's own (../wrangler.toml), so deploying one
# can never touch the other. It is not built from the repo: the live copy was
# pasted into the Cloudflare dashboard, and a change is deployed the same way.
# This file is here so it runs locally with
#
#   npx wrangler dev --local
#
# and so `npx wrangler deploy` from this folder reproduces the live setup,
# should anyone log wrangler in and prefer that.

name = "theoaks-redirect"
main = "index.js"
compatibility_date = "2026-09-02"

# theoaks.co.uk showed the same Wix site, so its old addresses are the same
# and go to the same places. Attached on 7 October 2026, when the domain
# moved from Wix's nameservers to Cloudflare's.
routes = [
  { pattern = "theoaks.uk", custom_domain = true },
  { pattern = "www.theoaks.uk", custom_domain = true },
  { pattern = "theoaks.co.uk", custom_domain = true },
  { pattern = "www.theoaks.co.uk", custom_domain = true },
]
